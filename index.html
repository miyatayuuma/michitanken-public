<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142c2c">
<title>みちたんけん | 架空の街を歩く</title>
</head>
<body>
<div id="app" data-mode="walk">
<header class="toolbar">
  <div class="brand"><strong>みちたんけん</strong><span>合成サンプル · 3Dフィールド</span></div>
  <div class="buttons">
    <button id="mode" class="selected" aria-label="俯瞰モードに切り替える">俯瞰</button>
    <button id="reset">位置を戻す</button>
    <button id="roads" class="selected" aria-pressed="true">道路</button>
    <button id="buildings" class="selected" aria-pressed="true">建物</button>
  </div>
</header>
<main>
  <div id="scene" role="region" aria-label="架空の3Dフィールド。歩行モードではドラッグで視点を動かせます"></div>
  <div id="status" role="status">地理データを読み込んでいます…</div>
  <aside id="details"></aside>
  <output id="player-coords" aria-label="プレイヤーの位置"></output>
  <div class="compass">N ↑</div>
  <div id="joystick" class="game-control" aria-label="移動スティック">
    <div id="joystick-knob"></div>
  </div>
  <button id="run" class="game-control" aria-label="押している間走る">走る</button>
</main>
<footer><span id="hint">左スティックで移動 · 画面ドラッグで視点変更 · 「走る」を押し続ける</span><span>サンプルは架空の地形です（実際の位置情報は含みません）</span></footer>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
