<!doctype html>
<html lang="ja" data-site-config-required="true">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5df">
<title>みちたんけん | 架空の街を歩く</title>
</head>
<body>
<div id="app" data-mode="walk">
<main>
<div id="scene" role="region" aria-label="3Dフィールド。ドラッグで視点を動かせます"></div>
<header class="toolbar"><div class="stack"><button id="mode" aria-label="地図を開く" class="icon paper" aria-expanded="false"></button><div id="characters" class="characters"></div></div><div class="stack"><div class="compass paper" aria-label="北の方向"><span class="north-needle">N ↑</span></div><button id="menu-open" class="icon paper" aria-label="メニュー" aria-expanded="false"></button></div></header>
<div id="status" class="paper" role="status">じゅんびしています…</div><button id="retry" class="paper" hidden>もういちど</button>
<div id="joystick" class="game-control" aria-label="移動スティック"><div id="joystick-knob"></div></div>
<button id="run" class="game-control" aria-label="押している間走る"></button>
<section id="notebook-menu" class="paper" aria-label="メニュー" hidden><button id="menu-close" class="paper">とじる</button><h1>道たんけん</h1><div id="standalone-audio"></div><div class="credits"><span>サンプルは架空の地形です（実際の位置情報は含みません）</span></div></section>
</main></div>
<script type="module" src="/src/main.js"></script>
</body></html>
