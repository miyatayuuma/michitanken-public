name: Public source water domain checks
on:
  pull_request:
    paths:
      - 'scripts/build-water-domain.py'
      - 'tests/test_water_domain.py'
      - 'lib/surface-mesh.mjs'
      - 'src/water.js'
      - '.github/workflows/surface-domain.yml'
permissions:
  contents: read
jobs:
  fictional-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: shapely==2.1.2
      - run: python -m unittest discover -s tests -p 'test_water_domain.py'
