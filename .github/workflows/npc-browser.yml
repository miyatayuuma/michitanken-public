name: Public NPC fictional browser checks
on:
  pull_request:
    paths:
      - 'src/npc*'
      - 'lib/npc.mjs'
      - 'tests/npc*'
      - 'scripts/browser-npc.mjs'
      - '.github/workflows/npc-browser.yml'
permissions:
  contents: read
jobs:
  npc-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/browser-npc.mjs artifacts/npc-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-fictional-browser
          path: artifacts/npc-browser
