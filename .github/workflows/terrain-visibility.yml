name: Public approved terrain acceptance
on:
  pull_request:
    paths:
      - 'src/main.js'
      - 'src/buildings.js'
      - 'lib/render-policy.mjs'
      - 'src/map-terrain.js'
      - 'src/exploration-map.js'
      - 'scripts/browser-approved-terrain*.mjs'
      - '.github/workflows/terrain-visibility.yml'
permissions:
  contents: read
jobs:
  fictional-terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Approved A pixel and save contract; fictional 81-screen acceptance
        run: |
          npm test
          node scripts/browser-approved-terrain-contract.mjs . artifacts/terrain-contract
          FIXTURE=$(mktemp -d)/fictional
          node scripts/create-biome-fixture.mjs "$FIXTURE"
          ln -s "$PWD/node_modules" "$FIXTURE/node_modules"
          node scripts/generate-exploration.mjs "$FIXTURE"
          node scripts/generate-map.mjs "$FIXTURE" "$FIXTURE/public/data/exploration-map.json"
          node scripts/create-warp-fixture.mjs "$FIXTURE"
          node scripts/browser-approved-terrain.mjs "$FIXTURE" artifacts/terrain-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-terrain-comparison
          path: artifacts/terrain-*
