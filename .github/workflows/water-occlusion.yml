name: Public water depth pixel acceptance
on:
  pull_request:
    paths:
      - 'src/water.js'
      - 'src/river-shader.js'
      - 'src/player-sprite.js'
      - 'src/buildings.js'
      - 'lib/road-surface.mjs'
      - 'scripts/browser-water-occlusion.mjs'
      - '.github/workflows/water-occlusion.yml'
permissions:
  contents: read
jobs:
  fictional-occlusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/browser-water-occlusion.mjs . artifacts/water-occlusion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-water-occlusion
          path: artifacts/water-occlusion
