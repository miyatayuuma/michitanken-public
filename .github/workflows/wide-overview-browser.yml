name: Public wide overview browser acceptance
on:
  pull_request:
    paths:
      - 'src/main.js'
      - 'src/buildings.js'
      - 'src/vegetation.js'
      - 'src/poi-markers.js'
      - 'lib/appearance.mjs'
      - 'lib/poi.mjs'
      - 'lib/biomes.mjs'
      - 'lib/spawn-policy.mjs'
      - 'src/style.css'
      - 'scripts/audit-spawn-safety.py'
      - 'src/biome-debug.js'
      - 'src/assets/cartography/**'
      - 'scripts/*biome*'
      - 'scripts/browser-mt02r-mt03.mjs'
      - 'public/data/pois.json'
      - 'scripts/browser-mt01-mt02.mjs'
      - 'src/tile-stream.js'
      - 'src/wide-overview.js'
      - 'src/player-sprite.js'
      - 'lib/sprite-animation.mjs'
      - 'lib/avatar-ground.mjs'
      - 'scripts/browser-player-sprite.mjs'
      - 'scripts/browser-wide-overview.mjs'
      - '.github/workflows/wide-overview-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public dependencies and mobile Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise fictional 5x5 atlas, map/walk switching, and GPU budgets
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 --strictPort > /tmp/michi-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-wide-overview.mjs
          node scripts/browser-player-sprite.mjs
          node scripts/browser-mt01-mt02.mjs
          BIOME_FIXTURE=$(mktemp -d)/fixture
          node scripts/create-biome-fixture.mjs "$BIOME_FIXTURE"
          ln -s "$PWD/node_modules" "$BIOME_FIXTURE/node_modules"
          node scripts/browser-mt02r-mt03.mjs "$BIOME_FIXTURE" artifacts/mt02r-mt03
          python scripts/audit-spawn-safety.py "$BIOME_FIXTURE" "$BIOME_FIXTURE/public/data/biomes.json" artifacts/mt02r-mt03/safety.json
      - name: Publish fictional mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task5c-fictional-wide-mobile
          path: |
            task5c-wide-mobile.png
            artifacts/mt02r-mt03
          if-no-files-found: ignore
