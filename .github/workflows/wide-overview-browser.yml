name: Public exploration map browser acceptance
on:
  pull_request:
    paths:
      - 'src/notebook-ui.js'
      - 'lib/map-view.mjs'
      - 'scripts/browser-notebook.mjs'
      - 'scripts/browser-collection-states.mjs'
      - 'src/main.js'
      - 'src/exploration-map.js'
      - 'src/landmark-fx.js'
      - 'src/sound.js'
      - 'lib/exploration-map.mjs'
      - 'lib/warp.mjs'
      - 'scripts/browser-warp.mjs'
      - 'scripts/create-warp-fixture.mjs'
      - 'scripts/browser-map.mjs'
      - 'scripts/generate-map.mjs'
      - 'public/data/exploration-map.json'
      - 'src/buildings.js'
      - 'src/vegetation.js'
      - 'src/poi-markers.js'
      - 'lib/appearance.mjs'
      - 'lib/poi.mjs'
      - 'lib/biomes.mjs'
      - 'lib/spawn-policy.mjs'
      - 'src/style.css'
      - 'scripts/audit-spawn-safety.py'
      - 'src/biome-debug.js'
      - 'src/exploration.js'
      - 'src/controls.js'
      - 'src/assets/exploration/**'
      - 'lib/exploration.mjs'
      - 'scripts/*exploration*'
      - 'public/data/exploration/**'
      - 'src/assets/cartography/**'
      - 'scripts/*biome*'
      - 'scripts/browser-mt02r-mt03.mjs'
      - 'public/data/pois.json'
      - 'scripts/browser-mt01-mt02.mjs'
      - 'src/tile-stream.js'
      - 'src/wide-overview.js'
      - 'src/player-sprite.js'
      - 'lib/sprite-animation.mjs'
      - 'lib/avatar-ground.mjs'
      - 'scripts/browser-player-sprite.mjs'
      - 'scripts/browser-wide-overview.mjs'
      - '.github/workflows/wide-overview-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public dependencies and mobile Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise fictional 25-tile 2D map and exploration
        run: |
          npm test
          BIOME_FIXTURE=$(mktemp -d)/fixture
          node scripts/create-biome-fixture.mjs "$BIOME_FIXTURE"
          ln -s "$PWD/node_modules" "$BIOME_FIXTURE/node_modules"
          node scripts/generate-exploration.mjs "$BIOME_FIXTURE"
          node scripts/generate-map.mjs "$BIOME_FIXTURE" "$BIOME_FIXTURE/public/data/exploration-map.json"
          node scripts/browser-map.mjs "$BIOME_FIXTURE" artifacts/mt07
          node scripts/browser-exploration-walk.mjs "$BIOME_FIXTURE" artifacts/mt07
          node scripts/create-warp-fixture.mjs "$BIOME_FIXTURE"
          node scripts/browser-warp.mjs "$BIOME_FIXTURE" artifacts/mt07c
          node scripts/browser-notebook.mjs "$BIOME_FIXTURE" artifacts/mt07e1
          node scripts/browser-collection-states.mjs "$BIOME_FIXTURE" artifacts/mt07e1
          python scripts/audit-spawn-safety.py "$BIOME_FIXTURE" "$BIOME_FIXTURE/public/data/biomes.json" artifacts/mt07/safety.json
      - name: Publish fictional mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt07-fictional-map
          path: |
            artifacts/mt07
            artifacts/mt07c
            artifacts/mt07e1
          if-no-files-found: ignore
