<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>道たんけん — 探検手帳 UI案</title>
<style>
:root{--paper:#fff5df;--ink:#303b35;--edge:#71644e;--action:#245b4d;--focus:#9b4b25;--quiet:#706b60;--disabled:#d7cfbd;--error:#923e39;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:var(--ink);background:#ece7db}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button:disabled{background:var(--disabled);color:#666155;cursor:default}header{max-width:1200px;margin:24px auto 18px;padding:0 20px}header small{letter-spacing:.14em;color:#655d50}h1{font-size:26px;margin:8px 0}header p{font-size:14px;line-height:1.7;margin:8px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}nav button,select{min-height:44px;border:1.5px solid var(--edge);border-radius:10px 8px 12px 7px;background:var(--paper);color:var(--ink);padding:8px 13px}nav button[aria-pressed=true]{background:var(--action);color:var(--paper)}.workspace{padding:0 20px 32px;display:flex;justify-content:center}.game{position:relative;width:min(1200px,100%);height:660px;overflow:hidden;background:#a8c7b0;border:2px solid var(--edge);border-radius:18px 14px 20px 13px;isolation:isolate}.game.mobile{width:390px;height:740px}.world{position:absolute;width:100%;height:100%;object-fit:cover}.world svg{width:100%;height:100%;display:block}.top{position:absolute;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;pointer-events:none;align-items:flex-start}.stack{display:flex;gap:10px;align-items:center;pointer-events:auto}.paper{background:var(--paper);border:1.5px solid var(--edge);border-radius:12px 9px 14px 8px;box-shadow:0 3px 0 #303b3520}.icon{width:48px;height:48px;display:inline-grid;place-items:center;padding:10px;color:var(--ink);flex-shrink:0}.icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.active{background:var(--action);color:var(--paper);border-color:var(--action)}.active:after{content:'';position:absolute;bottom:4px;width:14px;height:2px;background:currentColor}.characters{display:flex;gap:6px}.characters button{position:relative}.compass{width:58px;height:66px;display:grid;justify-items:center;padding:5px;background:#fff5dfed;pointer-events:none;border-radius:50% 45% 46% 40%;border:1.5px solid var(--edge);font-size:12px;font-weight:700}.needle{font-size:32px;line-height:34px;color:var(--focus);transform:rotate(-35deg)}.avatar{position:absolute;left:49%;top:58%;transform:translate(-50%,-50%);width:42px;height:64px;color:#3e493d;filter:drop-shadow(0 4px 1px #40584055)}.avatar svg{width:100%;height:100%;fill:#fff5df;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.spark{position:absolute;left:56%;top:64%;color:var(--action);width:54px;height:54px;border:2px solid var(--action);border-radius:50%;background:#fff5df70;box-shadow:0 0 0 3px var(--paper);display:grid;place-items:center;font-size:28px}.spark:before{content:'✧';position:absolute;top:-20px;color:var(--ink)}.pickup{position:absolute;right:24px;bottom:140px;width:64px;height:64px;background:var(--action);color:var(--paper);border:2px solid var(--paper);outline:1px solid var(--action);border-radius:45% 50% 42% 48%}.pickup kbd{position:absolute;right:-4px;top:-8px}.key{padding:2px 6px;font-size:12px;border:1px solid var(--edge);background:var(--paper);color:var(--ink);border-radius:5px;box-shadow:0 1px 0 var(--edge)}.touch{position:absolute;inset:0;pointer-events:none}.joy{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));left:22px;width:116px;height:116px;border:2px solid var(--paper);outline:1px solid var(--edge);background:#fff5df40;border-radius:48% 50% 46% 49%;pointer-events:auto;touch-action:none}.knob{display:block;width:48px;height:48px;background:var(--paper);border:1.5px solid var(--edge);border-radius:50%;margin:32px}.run{position:absolute;bottom:max(38px,env(safe-area-inset-bottom));right:26px;width:68px;height:68px;border-radius:48%;background:var(--paper);border:1.5px solid var(--edge);color:var(--ink);pointer-events:auto;font-weight:600}.run:active{background:var(--action);color:var(--paper);transform:translateY(2px)}.map{position:absolute;inset:0;background:var(--paper)}.map-title{position:absolute;top:28px;left:28px;font-size:22px;letter-spacing:.1em;margin:0}.map .top{left:auto}.mapview{position:absolute;left:36px;right:36px;top:98px;bottom:104px;overflow:hidden;border:1.5px solid var(--edge);border-radius:12px 8px 15px 10px;background:#f1e3bf;touch-action:none}.mapview>svg{width:100%;height:100%;display:block}.map .zoom{position:absolute;bottom:26px;right:26px;display:flex;align-items:center;gap:8px}.zoom output{font-size:14px;width:36px;text-align:center}.scale{position:absolute;bottom:30px;left:32px;font-size:12px}.scale div{width:80px;height:6px;border:solid var(--ink);border-width:0 2px 2px}.north{position:absolute;top:10px;left:14px;font-size:14px;font-weight:700;z-index:2}.marker{cursor:pointer;fill:var(--paper);stroke:var(--action);stroke-width:3}.marker.chosen{stroke:var(--focus);stroke-width:5}.site-label{font:16px system-ui;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5}.warp-card{position:absolute;left:50%;bottom:102px;transform:translateX(-50%);min-width:280px;padding:18px;display:flex;gap:16px;align-items:center}.warp-card h2{font-size:18px;margin:0 0 5px}.warp-card small{color:var(--quiet);font-size:12px}.primary{background:var(--action);color:var(--paper);border:1.5px solid var(--action);border-radius:10px 8px 12px 7px;min-height:48px;padding:10px 18px;white-space:nowrap;font-weight:700}.mobile .mapview{left:14px;right:14px;top:90px;bottom:170px}.mobile .warp-card{bottom:170px;max-width:calc(100% - 44px);min-width:0;width:calc(100% - 44px);gap:10px;padding:14px}.mobile .map-title{left:20px;font-size:19px;top:30px}.mobile .scale{bottom:112px;left:24px}.mobile .zoom{bottom:104px;right:18px}.mobile .pickup{right:28px;bottom:140px}.panel{position:absolute;inset:90px 24px auto auto;width:min(330px,calc(100% - 48px));padding:22px}.panel h2{font-size:20px;margin:0 0 18px}.panel label{display:flex;align-items:center;justify-content:space-between;min-height:52px}.panel input{accent-color:var(--action);max-width:150px}.notice{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:24px;text-align:center;max-width:calc(100% - 40px);min-width:270px}.notice h2{font-size:20px}.notice p{font-size:14px}.error{border-color:var(--error);border-width:2px}.feedback{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:70px;color:var(--action);text-shadow:0 0 12px var(--paper)}.caption{max-width:1200px;margin:0 auto;padding:0 20px 24px;font-size:13px;line-height:1.8;color:#625c50}[hidden]{display:none!important}@media(max-width:650px){header{margin-top:16px}h1{font-size:22px}.workspace{padding:0 10px 20px}.game{height:650px}nav{gap:6px}nav button{font-size:13px;padding:8px}.top{left:12px;right:12px}.stack{gap:6px}.icon{width:46px;height:46px}.compass{width:52px}.game.mobile{height:740px}.characters{gap:4px}}@media(max-height:500px){.game.mobile,.game{height:360px;width:min(1200px,100%)}.joy{width:96px;height:96px}.knob{margin:22px}.mapview,.mobile .mapview{top:75px;bottom:80px}.mobile .zoom,.zoom{bottom:16px}.mobile .scale,.scale{bottom:24px}.mobile .warp-card,.warp-card{bottom:80px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header><small>MT–07E–0 / DESIGN STUDY 01</small><h1>道たんけん · 手描きの探検手帳</h1><p>独立した画面案です。地形・地点・仮のキャラクターはすべて架空。本番の絵やデータは使用していません。</p><nav aria-label="画面案"><button data-view="walk">01 探索</button><button data-view="near">02 宝物</button><button data-view="map">03 地図</button><button data-view="zoom">04 拡大</button><button data-view="warp">05 ワープ</button><button data-view="touch">06 タッチ</button><button data-view="settings">設定</button><button data-view="loading">読込</button><button data-view="error">エラー</button><select id="device" aria-label="画面幅"><option value="desktop">PC幅</option><option value="mobile">スマホ幅</option></select></nav></header>
<div class="workspace"><main class="game" aria-label="デザインプレビュー"></main></div><p class="caption">画面の地図・猫／うさぎ・＋／−・戻る・メニューを操作できます。ワープは架空の成功表現のみ。実際の移動・採集・ピンチ・ゲームパッド接続は、この案では実装していません。</p>
<script>
const icons={map:'M3 5 9 3 15 5 21 3v16l-6 2-6-2-6 2ZM9 3v16M15 5v16',close:'m6 6 12 12M18 6 6 18',plus:'M12 5v14M5 12h14',minus:'M5 12h14',menu:'M4 6h16M4 12h16M4 18h16',cat:'m5 9-1-6 6 4h4l6-4-1 6c5 12-19 12-14 0ZM8 12h.1M16 12h.1m-6 4 2 1 2-1',rabbit:'M7 10C0-3 10-2 11 9h2c1-11 11-12 4 1 11 13-21 13-10 0ZM8 14h.1M16 14h.1m-6 4h4',hand:'M5 13 9 17h5l5-6c2-2 4 0 2 3l-5 7H8l-6-6c-2-3 1-4 3-2Zm4 4V5c0-3 3-3 3 0v7m0-6c0-3 3-3 3 0v7',flag:'M5 22V3l7 2 7-2v10l-7 2-7-2',run:'m13 5 1-1m-3 5 4 2 4-1M7 12l4-3 1 7-4 5m4-5 6 4',tree:'m12 3-7 9h4l-5 6h16l-5-6h4ZM12 18v4',check:'m5 12 4 4L19 6'};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[n]}"/></svg>`;
const btn=(n,label,act,cls='')=>`<button class="icon paper ${cls}" aria-label="${label}" data-act="${act}">${svg(n)}</button>`;
let view=new URLSearchParams(location.search).get('view')||'walk',zoom=1,character='cat',device=new URLSearchParams(location.search).get('device')||'desktop';const game=document.querySelector('.game');
function world(){return `<div class="world"><svg viewBox="0 0 1200 660" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="1200" height="660" fill="#a8c7b0"/><path d="M0 0H1200V180Q800 120 600 220T0 200" fill="#b9d4cb"/><path d="M0 240Q280 100 550 250T1200 200V660H0" fill="#a1bc84"/><path d="M1200 80Q700 210 930 440T680 700" fill="none" stroke="#8ebfc4" stroke-width="95"/><path d="M650 150 730 195 780 660H320L510 220Z" fill="#e5d7b7"/><path d="M580 200 570 660" stroke="#c6b491" stroke-width="4" opacity=".5"/>${[[-20,380,1.5],[130,260,1],[310,300,1.1],[840,220,.8],[1040,380,1.6],[900,570,1.4],[200,600,1.5],[1020,140,.7]].map(([x,y,s])=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cy="65" rx="44" ry="12" fill="#64825955"/><path d="M0 0v65" stroke="#776b48" stroke-width="12"/><path d="M0-65-42 17h18l-30 28H53L24 17h18Z" fill="#648d68"/><path d="M0-65v110H53L24 17h18Z" fill="#567c59" opacity=".55"/></g>`).join('')}<g fill="#92ac73"><ellipse cx="410" cy="510" rx="30" ry="12"/><ellipse cx="770" cy="420" rx="32" ry="10"/></g><path d="m690 435 12-6 16 6-4 11-20 2Z" fill="#c8c3b0" stroke="#878978" stroke-width="2"/></svg></div>`}
function mapSvg(){return `<svg viewBox="0 0 800 500" aria-label="架空の地図"><defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#706b60" stroke-opacity=".12"/></pattern></defs><g transform="translate(${zoom>1?-560:0} ${zoom>1?-350:0}) scale(${zoom})"><rect width="800" height="500" fill="#efe2be"/><rect width="800" height="500" fill="url(#grid)"/><path d="M40 40 300 10 360 180 250 220 60 170Z" fill="#aabd91"/><path d="m450 300 210-60 100 140-230 100Z" fill="#bdcd9f"/><path d="M550-20Q380 160 540 290T430 550" fill="none" stroke="#8ebfc4" stroke-width="46"/><g fill="none" stroke="#fff5df" stroke-width="14"><path d="M0 250 800 200M180 0 230 500M0 420 800 390"/></g><path d="M560 0H800V160Q680 220 610 150T560 0ZM0 350Q90 300 150 420V500H0" fill="#e1e4dc" stroke="#bfc6ba" stroke-width="2" stroke-dasharray="6 5"/><g role="button" tabindex="0" aria-label="こもれび公園を選ぶ" data-act="select"><circle class="hit" r="22" cx="320" cy="200" fill="transparent" stroke="none"/><circle class="marker ${view==='warp'?'chosen':''}" cx="320" cy="200" r="22"/><path d="m320 184-12 21h24Zm0 21v9" fill="none" stroke="#245b4d" stroke-width="2"/><text class="site-label" x="350" y="205">こもれび公園</text></g><g><circle class="marker" cx="550" cy="390" r="20"/><path d="M538 395q12-22 24 0m-24-6h24" fill="none" stroke="#245b4d" stroke-width="2"/></g><circle cx="400" cy="290" r="9" fill="#9b4b25" stroke="#fff5df" stroke-width="4"/><path d="m400 274-5 8h10Z" fill="#303b35"/></g></svg>`}
function render(){game.className='game '+(device==='mobile'?'mobile':'');document.querySelector('#device').value=device;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));let isMap=['map','zoom','warp'].includes(view);game.innerHTML=isMap?`<section class="map"><h2 class="map-title">たんけんマップ</h2><div class="top">${btn('close','地図を閉じる','back')}</div><div class="mapview"><div class="north">N ↑</div>${mapSvg()}</div><div class="scale"><span>${Math.round(200/zoom)} m</span><div></div></div><div class="zoom">${btn('minus','縮小','minus')}<output>${zoom}×</output>${btn('plus','拡大','plus')}</div>${view==='warp'?`<div class="warp-card paper"><div><h2>こもれび公園</h2><small>ワープできる</small></div><button class="primary" data-act="go">ここへいく</button></div>`:''}</section>`:world()+`<div class="top"><div class="stack">${btn('map','地図を開く','map')}<div class="characters" role="group" aria-label="キャラクター">${btn('cat','猫を選ぶ','cat',character==='cat'?'active':'')}${btn('rabbit','うさぎを選ぶ','rabbit',character==='rabbit'?'active':'')}</div></div><div class="stack"><div class="compass" aria-label="北は左上"><span>N</span><span class="needle">↑</span></div>${btn('menu','メニューを開く','settings')}</div></div><div class="avatar">${svg(character)}</div>${['near','touch'].includes(view)?`<div class="spark" aria-hidden="true">◇</div><button class="icon pickup" aria-label="宝物をひろう" data-act="collect">${svg('hand')}${view==='near'&&device==='desktop'?'<kbd class="key">E</kbd>':''}</button>`:''}${view==='touch'||device==='mobile'?'<div class="touch"><div class="joy" role="img" aria-label="移動スティックの画面案"><span class="knob"></span></div><button class="run" aria-label="押している間走る">走る</button></div>':''}${view==='settings'?'<section class="paper panel"><h2>メニュー</h2><label>BGM <input type="range" aria-label="BGM音量" value="50"></label><label>効果音 <input type="range" aria-label="効果音量" value="60"></label><label>動きをひかえめに <input type="checkbox"></label><button class="primary" data-act="back">もどる</button></section>':''}${view==='loading'?'<section class="paper notice" role="status"><h2>じゅんび中…</h2><p>少しまってね</p></section>':''}${view==='error'?'<section class="paper notice error" role="alert"><h2>よみこめませんでした</h2><p>通信をたしかめてね</p><button class="primary" data-act="loading">もういちど</button></section>':''}`;
 const ms=game.querySelector('.mapview>svg');if(ms){const r=ms.getBoundingClientRect();game.querySelector('.hit')?.setAttribute('r',Math.max(22,22/Math.min(r.width/800,r.height/500)/zoom));}game.querySelector('[data-act=minus]')?.toggleAttribute('disabled',zoom<=1);game.querySelector('[data-act=plus]')?.toggleAttribute('disabled',zoom>=4);game.querySelectorAll('.characters button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.act===character)));}
function action(a){if(a==='cat'||a==='rabbit')character=a;else if(a==='plus')zoom=Math.min(4,zoom+1);else if(a==='minus')zoom=Math.max(1,zoom-1);else if(a==='select')view='warp';else if(a==='back')view='walk';else if(a==='collect'||a==='go'){view='walk';render();const f=document.createElement('div');f.className='feedback';f.innerHTML=svg('check');f.setAttribute('role','status');f.setAttribute('aria-label',a==='go'?'ワープ成功の画面案':'採集成功の画面案');game.append(f);setTimeout(()=>f.remove(),700);return}else view=a;render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-act]');if(!b)return;if(b.dataset.view){view=b.dataset.view;zoom=view==='zoom'?3:1;if(view==='touch')device='mobile';render()}else action(b.dataset.act)});document.querySelector('#device').onchange=e=>{device=e.target.value;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape')action('back');if(e.key==='Enter'&&e.target.matches('[data-act=select]'))action('select')});if(view==='zoom')zoom=3;render();
</script></html>
